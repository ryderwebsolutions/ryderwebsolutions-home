<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book a strategy consultation with Ryder Web Solutions. Tell us your goals and challenges, then choose your call time.">
    <meta name="theme-color" content="#faf8f4">
    <title>Strategy Consultation | Ryder Web Solutions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="general-consultation.css">
    <script src="general-consultation.js" defer></script>
</head>
<body>
    <div class="page-container">
        <section class="form-section" id="form-section">
            <div class="section-content">
                <div class="section-header">
                    <h1>Book Your Free Strategy Call</h1>
                    <p>Takes under 2 minutes. Book your call instantly on the next screen.</p>
                </div>

                <div class="form-container">
                    <form id="assessment-form" class="multi-step-form">
                        <div class="form-progress">
                            <div class="progress-bar">
                                <div class="progress-fill"></div>
                            </div>
                            <p class="progress-text"><span class="current-question">1</span> of <span class="total-questions">7</span></p>
                        </div>

                        <input type="text" name="website" class="honeypot" style="display: none;" tabindex="-1" autocomplete="off">

                        <div class="form-question active" data-question="1">
                            <label for="business-name">What's the name of your business?</label>
                            <input type="text" id="business-name" name="business_name" placeholder="Your business name" autocomplete="organization" required>
                        </div>

                        <div class="form-question" data-question="2">
                            <label for="your-name">Who should we reach out to?</label>
                            <input type="text" id="your-name" name="your_name" placeholder="Your full name" autocomplete="name" required>
                        </div>

                        <div class="form-question" data-question="3">
                            <label for="work-email">Best email to reach you</label>
                            <input type="email" id="work-email" name="work_email" placeholder="your@email.com" autocomplete="email" required>
                        </div>

                        <div class="form-question" data-question="4">
                            <label for="phone-number">Best number to reach you</label>
                            <div class="phone-input-group">
                                <select id="phone-country-code" name="phone_country_code" required>
                                    <option value="+353" selected>Ireland (+353)</option>
                                    <option value="+44">UK (+44)</option>
                                    <option value="+1">US/Canada (+1)</option>
                                    <option value="+61">Australia (+61)</option>
                                    <option value="+971">UAE (+971)</option>
                                    <option value="+49">Germany (+49)</option>
                                    <option value="+33">France (+33)</option>
                                    <option value="+34">Spain (+34)</option>
                                    <option value="+39">Italy (+39)</option>
                                    <option value="+31">Netherlands (+31)</option>
                                </select>
                                <input type="tel" id="phone-number" name="phone_number" placeholder="Enter phone number" autocomplete="tel-national" inputmode="tel" required>
                            </div>
                        </div>

                        <div class="form-question" data-question="5">
                            <label for="business-location">Where are you based?</label>
                            <input type="text" id="business-location" name="business_location" placeholder="City, Country" autocomplete="address-level2" required>
                        </div>

                        <div class="form-question" data-question="6">
                            <label>What do you need most right now?</label>
                            <div class="form-options">
                                <label class="option-label">
                                    <input type="radio" name="service_interest" value="Digital transformation" required>
                                    <span>Digital transformation</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="service_interest" value="Marketing campaign">
                                    <span>Marketing campaign</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="service_interest" value="Booking systems">
                                    <span>Booking systems</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="service_interest" value="Custom software">
                                    <span>Custom software</span>
                                </label>
                                <label class="option-label">
                                    <input type="radio" name="service_interest" value="Other">
                                    <span>Other</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-question" data-question="7">
                            <label for="problems-facing">What's the main thing holding you back?</label>
                            <textarea id="problems-facing" name="problems_facing" rows="4" placeholder="Optional — anything specific you want us to know before the call"></textarea>
                        </div>

                        <div class="form-navigation">
                            <button type="button" class="nav-button nav-back" id="back-button">← Back</button>
                            <button type="button" class="nav-button nav-next" id="next-button">Next →</button>
                            <button type="submit" class="nav-button nav-submit" id="submit-button" style="display: none;">Submit And Continue To Booking</button>
                        </div>

                        <div class="form-error" id="form-error" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </section>

        <section class="success-section" id="success-section" style="display: none;">
            <div class="section-content">
                <div class="success-content">
                    <div class="success-icon">✓</div>
                    <h2>Thanks. Your details are in.</h2>
                    <p>Choose your preferred time below to confirm your consultation.</p>

                    <div class="success-divider"></div>

                    <h3>Next step: Book your call</h3>
                    <p class="success-subtext">Pick a time that suits you and lock it in.</p>

                    <div id="calendly-container"></div>
                    <a class="success-home-link" href="../">Continue to Home</a>
                </div>
            </div>
        </section>
    </div>

    <script src="https://assets.calendly.com/assets/external/widget.js" defer></script>
</body>
</html>
